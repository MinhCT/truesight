send_anonymous_usage_stats: true
project_id: tap-youtube-persona
default_environment: test
requires_meltano: '>=4.0'
environments:
- name: test
plugins:
  extractors:
  - name: tap-youtube-persona
    namespace: tap_youtube_persona
    pip_url: -e ../tap-youtube-persona
    executable: tap-youtube-persona
    settings:
      - name: refresh_token
        sensitive: true
      - name: google_client_id
        sensitive: true
      - name: google_client_secret
        sensitive: true
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
